[project]
name = "google-photos-takeout-reorganizer"
version = "0.1.0"
description = "Scripts para reorganizar fotos y vídeos exportados con Google Takeout"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "mutagen>=1.47.0",
]

[project.scripts]
rename-by-date = "takeout_reorganizer.rename_by_date:main"
organize-photos = "takeout_reorganizer.organize_photos:main"
compress-mov = "takeout_reorganizer.compress_mov:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
